# Runs on every push and pull request.
#
# Python 3.10 is the documented floor (Ubuntu 22.04's system Python) and
# 3.12 is Ubuntu 24.04's, so both are tested. The panel uses only the
# standard library, so there is nothing to install.
#
# py_compile cannot see errors inside the JavaScript that lives in Python
# strings — broken JavaScript still compiles and the browser shows a blank
# page. tests/check_js.py extracts every inline script and runs
# `node --check` on it; Node.js is preinstalled on GitHub's runners.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: unit tests
        run: python3 -m unittest discover -s tests -v

      - name: py_compile
        run: python3 -m py_compile wg_panel.py

      - name: JavaScript syntax
        run: python3 tests/check_js.py

      # The installers and docker/ scripts are not exercised by the tests;
      # a syntax check is their only gate.
      - name: bash -n
        run: |
          n=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; exit 1; }
            n=$((n + 1))
          done < <(find . -name '*.sh' -type f \
                        -not -path './.git/*' -not -path '*/dist/*' | sort)
          echo "$n shell scripts checked"
