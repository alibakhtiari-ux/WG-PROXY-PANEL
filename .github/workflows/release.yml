# Publishes a GitHub release when a version tag is pushed:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag must have a "## [1.1.0]" section in CHANGELOG.md; its text becomes
# the release notes. The same checks as the verify workflow run first, so a
# broken build is never released. Assets: wg_panel.py, wg-panel.service, the
# bundled qr.js and three.js files, and SHA256SUMS — everything the panel
# serves from its own directory, so a server can install it with one download.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tests
        run: |
          python3 -m unittest discover -s tests
          python3 -m py_compile wg_panel.py
          python3 tests/check_js.py

      - name: release notes
        run: python3 .github/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: assets
        run: |
          # هر فایلی که پنل از کنارِ خودش سرو می‌کند باید در ریلیز باشد:
          # qr.js و three.js از BASE_DIR خوانده می‌شوند و در نبودشان ۴۰۴
          # می‌دهند (QR/صفحه‌ی اشتراک و نمای سه‌بعدیِ TV از کار می‌افتند).
          # tests/test_release.py این فهرست را با wg_panel.py و READMEها
          # هم‌خوان نگه می‌دارد.
          ASSETS="wg_panel.py wg-panel.service qr.js three.module.min.js.gz three.core.min.js.gz three.LICENSE.txt"
          mkdir dist
          cp $ASSETS dist/
          (cd dist && sha256sum $ASSETS > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
