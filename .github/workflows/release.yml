# Publishes a GitHub release when a version tag is pushed:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag must have a "## [1.1.0]" section in CHANGELOG.md; its text becomes
# the release notes. The same checks as the verify workflow run first, so a
# broken build is never released. Assets: wg_panel.pyz (the whole panel),
# wg_panel.py (its 20-line launcher; install both side by side), wg-panel.service, the
# bundled qr.js and three.js files, and SHA256SUMS — everything the panel
# serves from its own directory, so a server can install it with one download.
# The optional WG-NQMO engine (from 1.4.0) adds wg_nqmo.pyz and wg-nqmo.service
# with their own list, SHA256SUMS.nqmo.
#
# This workflow is the only way a release is made: push the tag and nothing
# else. A release created by hand first makes this run fail ("a release with
# the same tag name already exists"), and its assets are not the ones built here.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tests
        run: |
          python3 -m unittest discover -s tests
          python3 tools/build_pyz.py --out dist/wg_panel.pyz && python3 dist/wg_panel.pyz --check
          python3 tools/build_nqmo_pyz.py --out dist/wg_nqmo.pyz && python3 -I dist/wg_nqmo.pyz --check
          python3 tests/check_js.py

      - name: release notes
        run: python3 .github/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: assets
        run: |
          # هر فایلی که پنل از کنارِ خودش سرو می‌کند باید در ریلیز باشد:
          # qr.js و three.js از BASE_DIR خوانده می‌شوند و در نبودشان ۴۰۴
          # می‌دهند (QR/صفحه‌ی اشتراک و نمای سه‌بعدیِ TV از کار می‌افتند).
          # tests/test_release.py این فهرست را با wg_panel.py و READMEها
          # هم‌خوان نگه می‌دارد.
          # پنل = wg_panel.pyz (در مرحله‌ی tests ساخته شد و در dist/ است)؛
          # wg_panel.py لانچرِ آن است و هر دو باید کنارِ هم نصب شوند.
          # SHA256SUMS فقط همان فایل‌هایی را فهرست می‌کند که دستورِ نصبِ README
          # دانلود می‌کند: `sha256sum -c` برای هر فایلِ فهرست‌شده‌ی دانلودنشده
          # «No such file» می‌دهد و نصب می‌ایستد (1.4.0 و 1.4.1 که دستی ساخته
          # شدند موتور را در همین فایل داشتند). موتورِ WG-NQMO اختیاری است و
          # فهرستِ خودش را دارد. tests/test_deploy.py هر دو را می‌پاید.
          ASSETS="wg_panel.pyz wg_panel.py wg-panel.service qr.js three.module.min.js.gz three.core.min.js.gz three.LICENSE.txt"
          NQMO_ASSETS="wg_nqmo.pyz wg-nqmo.service"
          mkdir -p dist
          cp wg_panel.py wg-panel.service qr.js three.module.min.js.gz three.core.min.js.gz three.LICENSE.txt dist/
          cp deploy/wg-nqmo.service dist/
          (cd dist && sha256sum $ASSETS > SHA256SUMS && sha256sum $NQMO_ASSETS > SHA256SUMS.nqmo)
          cat dist/SHA256SUMS dist/SHA256SUMS.nqmo

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
