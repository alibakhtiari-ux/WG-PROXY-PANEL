# سورس: deploy/wg-nqmo-capture.conf → /etc/systemd/system/wg-nqmo.service.d/capture.conf
# گامِ D4: فقط با مجوزِ شنودِ هدر نصب می‌شود. همراهش deploy/wg-nqmo.capture.config.json می‌رود.
# CAP_NET_ADMIN هرگز: خواندنِ کلیدِ خصوصی و PSK با `wg show` همان را می‌خواهد.
[Service]
CapabilityBoundingSet=CAP_NET_RAW
AmbientCapabilities=CAP_NET_RAW
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_PACKET
