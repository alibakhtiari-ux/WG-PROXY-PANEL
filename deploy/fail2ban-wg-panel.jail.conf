# /etc/fail2ban/jail.d/wg-panel.conf
# ۵ ورودِ ناموفق در ۱۰ دقیقه → بنِ ۱ ساعته در سطحِ فایروال.
# 127.0.0.1 هرگز بن نمی‌شود (دسترسیِ اضطراری).
[wg-panel]
enabled  = true
filter   = wg-panel
logpath  = /opt/wg-panel/actions.log
maxretry = 5
findtime = 600
bantime  = 3600
ignoreip = 127.0.0.1/8 ::1

# --- افزوده ۳۰ ژوئیه ۲۰۲۶ — پیش از این زندان کاملاً بی‌اثر بود ---
# backend: بدونِ این خط، backend=auto سراسری روی سیستمِ systemd به journald
# می‌افتد و logpath بالا هرگز خوانده نمی‌شود. نشانه‌اش این بود که
# «fail2ban-client get wg-panel logpath» جواب می‌داد: No file is monitored،
# در حالی که fail2ban-regex روی همان فایل ۱۶ تطبیق پیدا می‌کرد (از جمله
# یک تلاشِ واقعی با user=admin در ۲۷ ژوئیه که زندان ندیده بود).
backend  = polling

# port: بدونِ این خط، port=0:65535 از [DEFAULT] ارث می‌رسد و بن همهٔ
# پورت‌ها را می‌بندد — یعنی یک اشتباهِ تایپِ رمزِ پنل، SSH را هم قطع
# می‌کرد. کاربر IP ثابت ندارد پس ignoreip چاره نیست؛ محدودکردنِ بن به
# خودِ پورتِ پنل تضمین می‌کند مسیرِ بازیابی همیشه باز بماند.
port     = 8787
