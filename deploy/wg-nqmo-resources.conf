# سورس: deploy/wg-nqmo-resources.conf → /etc/systemd/system/wg-nqmo.service.d/resources.conf
# §29.159 (۵ نوامبر ۲۰۲۶): با شنودِ هدر روشن، موتور دو بار با watchdog کشته شد
# (۱۷:۴۶ و ۱۱:۵۱): CPUQuota=20% در ۱۵٬۳۱۳ دوره throttle کرد و RSS به ۱۳۰MB رسید و
# ۲۰۹ بار از MemoryHigh=128M گذشت؛ نخِ اصلی در ۹۰ ثانیه heartbeat نداد.
# سقف‌های پایه در خودِ یونیت می‌مانند (گاردِ NqmoDeployUnitTests)؛ این drop-in
# فقط سه مقدار را بالا می‌برد. همراهش s4_cpu_pct_max در config.json از ۱۵ به ۳۰
# رفت تا چرخشِ نمونه‌ی S4 با سقفِ تازه هم‌خوان باشد.
# §29.162 (۷ نوامبر ۲۰۲۶): با ۴۰٪ هم بستنِ پنجره (≈۱٫۹ s CPU) در تمامِ طولش throttle
# می‌شد — سنجشِ مستقیمِ cpu.stat روی مرزِ ۱۱:۴۵: ۳٫۰ s از ۴٫۲ s ِ flush انتظارِ سهمیه،
# و با ترافیکِ شنودِ S4 تا ۲۵٫۸ s. ۲۰۰٪ = دو هسته از ۱۶؛ Nice=10 همچنان مسیرِ داده را
# مقدم نگه می‌دارد و سقف همچنان بسته است.
[Service]
CPUQuota=200%
MemoryHigh=256M
MemoryMax=320M
